---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filter-reading-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: filter-reading
  template:
    metadata:
      labels:
        app: filter-reading
    spec:
      containers:
        - image: $FILTER_IMAGE
          name: filter-reading
          env:
            - name: GCP_PROJECT
              value: $PROJECT
            - name: TOPIC_NAME
              value: meter
            - name: SUB_ID
              value: meter-filter-sub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convert-reading-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: convert-reading
  template:
    metadata:
      labels:
        app: convert-reading
    spec:
      containers:
        - image: $CONVERT_IMAGE
          name: convert-reading
          env:
            - name: GCP_PROJECT
              value: $PROJECT
            - name: TOPIC_NAME
              value: meter
            - name: SUB_ID
              value: meter-convert-sub
---
